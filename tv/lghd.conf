# lghd.conf - read by the plugin at the start of each playback.
# One KEY=value per line, no inline comments. Environment variables override this file.
# Tested on an LG C2 (webOS 24) with a Sonos soundbar on eARC.

# Output buffer batching in ms (0 = one buffer per decoded access unit; tested value).
LGHD_BATCH_MS=0

# Optional:
#   LGHD_DVTAG=0            disable Dolby Vision caps tagging for MKV (lghddvtag)
#   LGHD_DV_PROFILE=8       force the DV profile reported to LG's decoder
#   LGHD_NO_EARC=1          don't ask audiooutputd to switch eARC to multichannel PCM
#   LGHD_CH=6               channel count reported to audiooutputd (2, 6 or 8)
#   LGHD_SWAP_CLFE=0        disable the centre/LFE swap
#   LGHD_GST_DEBUG=dvbin:5,lxvideodec:5   GStreamer debug output to /tmp/lghd_gst.log
